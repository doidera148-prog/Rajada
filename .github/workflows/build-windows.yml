name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Rodar testes
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Publicar acelerador.exe
        uses: actions/upload-artifact@v4
        with:
          name: acelerador-windows
          path: target/x86_64-pc-windows-msvc/release/acelerador.exe
