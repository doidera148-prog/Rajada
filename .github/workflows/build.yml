name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binario: rajada.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binario: rajada
          - os: macos-latest
            target: aarch64-apple-darwin
            binario: rajada

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compilar release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rodar testes
        run: cargo test --release --target ${{ matrix.target }}

      - name: Publicar binário
        uses: actions/upload-artifact@v4
        with:
          name: rajada-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binario }}
