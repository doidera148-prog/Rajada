name: Build

on:
  push:
    # Commits que mexem só em dist/ não disparam o workflow (evita loop).
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

# Uma execução nova cancela a anterior da mesma branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binario: rajada.exe
            destino: rajada-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binario: rajada
            destino: rajada-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binario: rajada
            destino: rajada-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compilar release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rodar testes
        run: cargo test --release --target ${{ matrix.target }}

      - name: Preparar binário
        shell: bash
        run: |
          mkdir -p saida
          cp "target/${{ matrix.target }}/release/${{ matrix.binario }}" "saida/${{ matrix.destino }}"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.destino }}
          path: saida/${{ matrix.destino }}

  publicar:
    # Só roda em push para o main, depois que os três builds passaram.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Baixar binários
        uses: actions/download-artifact@v4
        with:
          path: baixados
          merge-multiple: true

      - name: Copiar para dist/
        shell: bash
        run: |
          mkdir -p dist
          cp baixados/rajada-linux-x86_64 dist/
          cp baixados/rajada-windows-x86_64.exe dist/
          cp baixados/rajada-macos-arm64 dist/
          chmod 755 dist/rajada-linux-x86_64 dist/rajada-macos-arm64

      - name: Commitar e enviar ao main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist/ já está atualizado."
            exit 0
          fi
          git commit -m "Atualiza binários em dist/ [skip ci]"
          # Se o main avançou enquanto isso, a execução do commit novo gera dist/ de novo.
          git push origin HEAD:main || echo "main avançou; a próxima execução atualiza dist/."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
