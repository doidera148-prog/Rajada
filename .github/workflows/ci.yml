name: CI

on:
  push:
    # Sem "branches", o GitHub só dispara para tags quando "tags" está definido.
    branches:
      - main
    # Tags v* geram uma release com os binários (aba Releases).
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Uma execução nova cancela a anterior da mesma referência.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Diagnóstico: formatação, lints, testes e vulnerabilidades nas dependências.
  diagnostico:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatação (rustfmt)
        run: cargo fmt --check

      - name: Lints (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test --all-targets

      - name: Vulnerabilidades nas dependências
        uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Binários para Windows e Linux.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binario: rajada.exe
            destino: rajada-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binario: rajada
            destino: rajada-linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compilar release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rodar testes
        run: cargo test --release --target ${{ matrix.target }}

      - name: Teste de fumaça (a janela abre sem erro)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libegl1 libxkbcommon0 libgtk-3-0 >/dev/null
          # timeout devolve 124 quando o programa continua rodando, que é o esperado.
          set +e
          xvfb-run -a timeout 8 target/${{ matrix.target }}/release/${{ matrix.binario }}
          codigo=$?
          set -e
          if [ "$codigo" -ne 124 ]; then
            echo "::error::o programa encerrou cedo (código $codigo)"
            exit 1
          fi

      - name: Preparar binário
        shell: bash
        run: |
          mkdir -p saida
          cp "target/${{ matrix.target }}/release/${{ matrix.binario }}" "saida/${{ matrix.destino }}"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.destino }}
          path: saida/${{ matrix.destino }}

  # Binário universal para macOS (Apple Silicon e Intel).
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Compilar e testar (Apple Silicon)
        run: |
          cargo test --release --target aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Compilar (Intel)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Unir em binário universal
        run: |
          mkdir -p saida
          lipo -create -output saida/rajada-macos-universal \
            target/aarch64-apple-darwin/release/rajada \
            target/x86_64-apple-darwin/release/rajada

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: rajada-macos-universal
          path: saida/rajada-macos-universal

  # Só em push para o main: aplica rustfmt e clippy --fix, e envia se os testes passarem.
  corrigir:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Aplicar correções automáticas
        run: |
          cargo clippy --fix --allow-dirty --all-targets || true
          cargo fmt

      - name: Testar as correções
        shell: bash
        run: |
          if ! cargo test --all-targets; then
            echo "Os testes falharam com as correções. Nada foi enviado."
            git checkout -- .
            exit 0
          fi

      - name: Enviar correções ao main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma correção necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correções automáticas: rustfmt e clippy [skip ci]"
          git push origin HEAD:main || echo "main avançou; a próxima execução verifica de novo."

  # Só em tags v*: cria a release com os binários e a soma SHA-256.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar binários
        uses: actions/download-artifact@v4
        with:
          path: baixados
          merge-multiple: true

      - name: Gerar SHA256SUMS
        run: |
          cd baixados
          sha256sum rajada-linux-x86_64 rajada-windows-x86_64.exe rajada-macos-universal > SHA256SUMS.txt

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            baixados/rajada-linux-x86_64 \
            baixados/rajada-windows-x86_64.exe \
            baixados/rajada-macos-universal \
            baixados/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rajada $GITHUB_REF_NAME" \
            --generate-notes
