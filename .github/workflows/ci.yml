name: CI

on:
  push:
    # Sem "branches", o GitHub só dispara para tags quando "tags" está definido.
    branches:
      - main
    # Tags v* geram uma release com os binários (aba Releases).
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Uma execução nova cancela a anterior da mesma referência.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Diagnóstico: formatação, lints, testes e vulnerabilidades nas dependências.
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Formatação (rustfmt)
        run: cargo fmt --check

      - name: Lints (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test --all-targets

  # Binários para Windows e Linux.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binario: rajada.exe
            destino: rajada-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binario: rajada
            destino: rajada-linux-x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Compilar release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rodar testes
        run: cargo test --release --target ${{ matrix.target }}

      - name: Teste de fumaça (a janela abre sem erro)
        id: fumaca
        if: matrix.os == 'ubuntu-latest'
        # Aviso, não bloqueia. Roda com o renderizador padrão (wgpu) e com o OpenGL (glow).
        continue-on-error: true
        env:
          # O log do programa vai para uma pasta própria, guardada como artefato se falhar.
          XDG_STATE_HOME: ${{ runner.temp }}/estado
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-vulkan-drivers libxkbcommon0 libgtk-3-0 >/dev/null
          bin=target/${{ matrix.target }}/release/${{ matrix.binario }}
          # Roda os dois renderizadores sempre, para comparar. timeout devolve 124 = rodou sem erro.
          set +e
          xvfb-run -a timeout 8 "$bin" > "$RUNNER_TEMP/wgpu.txt" 2>&1
          padrao=$?
          ACEL_TESTE=glow xvfb-run -a timeout 8 "$bin" > "$RUNNER_TEMP/glow.txt" 2>&1
          glow=$?
          set -e
          echo "Código de saída: wgpu=$padrao glow=$glow (124 = rodou sem erro)"
          for nome in wgpu glow; do
            echo "===== Saída do $nome (últimas 60 linhas) ====="
            tail -n 60 "$RUNNER_TEMP/$nome.txt" || true
          done
          echo "===== Log do Rajada (últimas 120 linhas) ====="
          tail -n 120 "$XDG_STATE_HOME/Rajada/logs/rajada.log" 2>/dev/null || echo "(sem log)"
          for nome in wgpu glow; do
            linha=$(grep -m1 -A2 "panicked" "$RUNNER_TEMP/$nome.txt" | tr '\n' ' ' || true)
            if [ -n "$linha" ]; then
              echo "::error title=pânico no $nome::$linha"
            fi
          done
          falhou=0
          if [ "$padrao" -ne 124 ]; then
            echo "::error::programa encerrou cedo com wgpu (código $padrao)"
            falhou=1
          fi
          if [ "$glow" -ne 124 ]; then
            echo "::error::programa encerrou cedo com glow (código $glow)"
            falhou=1
          fi
          exit $falhou

      - name: Guardar log do teste de fumaça
        if: matrix.os == 'ubuntu-latest' && steps.fumaca.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 7
          name: log-fumaca
          path: ${{ runner.temp }}/estado/Rajada/logs/
          if-no-files-found: warn

      - name: Preparar binário
        shell: bash
        run: |
          mkdir -p saida
          cp "target/${{ matrix.target }}/release/${{ matrix.binario }}" "saida/${{ matrix.destino }}"

      - name: Publicar artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 7
          name: ${{ matrix.destino }}
          path: saida/${{ matrix.destino }}

  # Binário universal para macOS (Apple Silicon e Intel).
  build-macos:
    # macOS é o runner mais caro: roda em tags (release) e sob demanda.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos

      - name: Compilar e testar (Apple Silicon)
        run: |
          cargo test --release --target aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Compilar (Intel)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Unir em binário universal
        run: |
          mkdir -p saida
          lipo -create -output saida/rajada-macos-universal \
            target/aarch64-apple-darwin/release/rajada \
            target/x86_64-apple-darwin/release/rajada

      - name: Publicar artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 7
          name: rajada-macos-universal
          path: saida/rajada-macos-universal

  # Só em push para o main: aplica rustfmt e clippy --fix, e envia se os testes passarem.
  corrigir:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Aplicar correções automáticas
        run: |
          cargo clippy --fix --allow-dirty --all-targets || true
          cargo fmt

      - name: Testar as correções
        shell: bash
        run: |
          if ! cargo test --all-targets; then
            echo "Os testes falharam com as correções. Nada foi enviado."
            git checkout -- .
            exit 0
          fi

      - name: Enviar correções ao main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma correção necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correções automáticas: rustfmt e clippy [skip ci]"
          git push origin HEAD:main || echo "main avançou; a próxima execução verifica de novo."

  # Só em tags v*: cria a release com os binários e a soma SHA-256.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Baixar binários
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: baixados
          merge-multiple: true

      - name: Gerar SHA256SUMS
        run: |
          cd baixados
          sha256sum rajada-linux-x86_64 rajada-windows-x86_64.exe rajada-macos-universal > SHA256SUMS.txt

      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arquivos=(
            baixados/rajada-linux-x86_64
            baixados/rajada-windows-x86_64.exe
            baixados/rajada-macos-universal
            baixados/SHA256SUMS.txt
          )
          # Se a release já existe (criada à mão, ou nova execução), só atualiza os arquivos.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${arquivos[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${arquivos[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rajada $GITHUB_REF_NAME" \
              --generate-notes
          fi
