name: Diagnóstico e correção automática

on:
  push:
    paths-ignore:
      - 'dist/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

# Uma execução nova cancela a anterior da mesma branch.
concurrency:
  group: diagnostico-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Só relata: formatação, lints, testes e vulnerabilidades nas dependências.
  diagnostico:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Formatação (rustfmt)
        run: cargo fmt --check

      - name: Lints (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test --all-targets

      - name: Vulnerabilidades nas dependências
        uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Aplica correções mecânicas (rustfmt e clippy --fix) e envia ao main
  # somente se os testes continuarem passando. Caso contrário, descarta tudo.
  corrigir:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Aplicar correções automáticas
        run: |
          cargo clippy --fix --allow-dirty --all-targets || true
          cargo fmt

      - name: Testar as correções
        shell: bash
        run: |
          if ! cargo test --all-targets; then
            echo "Os testes falharam com as correções. Nada foi enviado."
            git checkout -- .
            exit 0
          fi

      - name: Enviar correções ao main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma correção necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correções automáticas: rustfmt e clippy [skip ci]"
          git push origin HEAD:main || echo "main avançou; a próxima execução verifica de novo."
