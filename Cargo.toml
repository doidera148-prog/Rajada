[package]
name = "rajada"
version = "0.4.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", features = ["glow"] }
rfd = "0.18.0"
ureq = "2"
sha2 = "0.10"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
