[package]
name = "rajada"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", features = ["glow"] }
rfd = "0.18.0"
ureq = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
